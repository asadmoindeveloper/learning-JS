<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
</head>
<body bgcolor="black">

    <center><p style="color: white;" >Here is your clock</p>
    <div id="clock" style="background-color: orange;" style="color: white;" style="width: 100px;"></div></center>
</body>
<script>
    const clock = document.getElementById("clock")

    setInterval(function(){
        let date = new Date()
        clock.innerHTML = date.toLocaleTimeString()
        clock.style.background = "white"
        clock.style.width = "100px"
        clock.style.height = "100px"
        clock.style.textAlign = "center"
        clock.style.alignContent = "center"
        clock.style.borderRadius = "10px"
    },1000)
</script>
</html>
