<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>

    //add element

    function langname(name){
        const li = document.createElement("li")
        li.innerHTML = `${name}`
        document.querySelector(".language").appendChild(li)
    }
    // langname("python")
    // langname("c++")

    function langname(name){
        const li = document.createElement("li")
        li.appendChild(document.createTextNode(name))
        document.querySelector(".language").appendChild(li)
    }
    langname("typescript")
    langname("javava")

    //Edit element
    const second = document.querySelector("li:nth-child(3)")
    const newli = document.createElement("li")
    newli.textContent = "java"
    second.replaceWith(newli)

    const newlii = document.querySelector("li:first-child")
    newlii.outerHTML = "<li>c#</li>"


    //Remove element
    const newliii = document.querySelector("li:last-child")
    newliii.remove()
</script>
</html>
